<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essyn</title>

    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wght@300&display=swap" rel="stylesheet" />

    <style>
        :root {
            --primary: #0d0d0d;
            --accent: #d4af37;
            --bg: #121212;
            --text: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            height: 100vh;
        }

        .container {
            width: 300px;
            display: flex;
            flex-direction: column;
            margin: auto;
        }

        .navbar {
            background-color: var(--primary);
            height: 70px;
            width: 100%;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .name {
            font-family: "Bebas Neue", cursive;
            font-size: 2.2rem;
            color: var(--accent);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .info-container {
            margin-top: 100px;
            text-align: center;
        }

        .image {
            height: 110px;
            width: 110px;
            border-radius: 100px;
            margin: auto;
            background: url("./profile.jpg") no-repeat center / cover;
        }

        .description {
            color: var(--text);
            font-family: "Bebas Neue", cursive;
            font-size: 1.8rem;
            margin-top: 20px;
        }

        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            color: var(--accent);
        }

        .divider-line {
            width: 60px;
            height: 3px;
            background-color: var(--accent);
        }

        .divider i {
            margin: 0 15px;
        }

        .link {
            background-color: var(--primary);
            height: 65px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-family: "Noto Sans Display", sans-serif;
            font-size: 1.3rem;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .link:hover {
            background-color: var(--accent);
            color: var(--primary);
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            background-color: var(--primary);
            text-align: center;
            font-size: 0.7rem;
            color: #666;
            font-family: "Noto Sans Display", sans-serif;
        }

        .footer span {
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <span class="name">ESSYN</span>
    </nav>

    <div class="info-container container">
        <div class="image"></div>
        <div class="description">Video Essays · Consciousness · New Earth</div>
    </div>

    <div class="divider">
        <div class="divider-line"></div>
        <i class="fas fa-bolt-lightning"></i>
        <div class="divider-line"></div>
    </div>

    <div class="container">
        <a class="link" href="https://youtube.com">
            YouTube
        </a>

        <a class="link" href="https://patreon.com">
            Support the Essays
        </a>

        <a class="link" href="https://danieljalexander.com">
            Main Website
        </a>
    </div>

    <div class="footer">
        <span>© Essyn — All paths lead inward</span>
    </div>

</body>
</html>
